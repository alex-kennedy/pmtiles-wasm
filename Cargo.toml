[package]
name = "pmtiles-wasm"
version = "0.1.0"
authors = ["Alex Kennedy <alex@alexkennedy.dev>"]
edition = "2024"
license = "MIT"
description = "PMTiles client in rust web assembly"
repository = "https://github.com/alex-kennedy/pmtiles-wasm"
readme = "README.md"
keywords = ["pmtiles", "tiles", "maps", "wasm", "geospatial"]
categories = ["wasm", "science::geo"]
rust-version = "1.85"
exclude = ["testdata/spec/", "tests/"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["gzip", "console_error_panic_hook"]
gzip = []
brotli = ["dep:brotli"]
zstd = ["dep:ruzstd"]

[dependencies]
brotli = { version = "9.1.1", optional = true }
bytes = "1.12.1"
console_error_panic_hook = { version = "0.1.7", optional = true }
fast_hilbert = "2.1.0"
futures-util = "0.3.34"
integer-encoding = "4.1.0"
js-sys = "0.3.82"
lru = "0.19.0"
reqwest = { version = "0.13.5", default-features = false }
ruzstd = { version = "0.9.1", optional = true }
thiserror = "2.0.21"
url = "2.5.8"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.82", features = [
  "ReadableStream",
  "ReadableWritablePair",
  "Response",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
rstest = "0.28.0"
approx = "0.5.1"
futures-test = "0.3.34"
web-sys = { version = "0.3.82", features = ["Blob", "Url"] }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"

[package.metadata.bin]
wasm-pack = { version = "0.15.0", locked = true }
