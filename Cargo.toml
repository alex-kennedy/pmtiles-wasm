[package]
name = "pmtiles-wasm"
version = "0.1.0"
authors = ["Alex Kennedy <apkennedy@me.com>"]
edition = "2024"
license = "MIT"
description = "PMTiles client in rust web assembly"
repository = "https://github.com/alex-kennedy/pmtiles-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook", "brotli", "gzip", "zstd"]
brotli = ["dep:brotli"]
zstd = ["dep:ruzstd"]
gzip = ["dep:flate2"]

[dependencies]
brotli = { version = "8.0.2", optional = true }
bytes = "1.11.0"
console_error_panic_hook = { version = "0.1.7", optional = true }
fast_hilbert = "2.0.2"
flate2 = { version = "1.1.5", optional = true }
integer-encoding = "4.1.0"
lru = "0.16.2"
reqwest = { version = "0.12.24", default-features = false }
rstest = "0.26.0"
ruzstd = { version = "0.8.2", optional = true }
thiserror = "2.0.17"
url = "2.5.8"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.55"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
rstest = "0.26.0"
approx = "0.5.1"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
